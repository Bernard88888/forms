<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#EEF3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Report">
<title>ABC Electric · Field report</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>html,body{margin:0;background:#EEF3EF}</style>
</head><body>
<!-- NEXORA FOREMAN FORM (Ground green style) - paste into a WordPress "Custom HTML" block -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<div id="nxf" style="--bg:#EEF3EF;--surface:#FFFFFF;--ink:#14231B;--muted:#56655C;--line:#D3DDD6;--field:#F6F9F7;--accent:#16754A;--accent-ink:#FFFFFF;--accent-soft:#E1F0E7;--ok:#16754A">
<style>
#nxf{--r:14px;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;box-sizing:border-box;padding:20px 18px 120px;-webkit-font-smoothing:antialiased}
#nxf *{box-sizing:border-box}
#nxf svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#nxf .wrap{max-width:440px;margin:0 auto}
#nxf .head{display:flex;align-items:center;gap:14px;margin:4px 0 26px}
#nxf .badge{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-weight:800;font-size:17px;letter-spacing:.5px}
#nxf .head h1{font-size:24px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.3px}
#nxf .head p{margin:3px 0 0;font-size:14px;color:var(--muted);font-weight:500}

/* choice: segmented */
#nxf .seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:5px;margin-bottom:22px}
#nxf .seg .slider{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:12px;background:var(--accent);
  transition:transform .28s cubic-bezier(.3,.7,.2,1)}
#nxf .seg[data-t="dr"] .slider{transform:translateX(100%)}
#nxf .seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;
  background:none;font:inherit;font-weight:700;font-size:16px;color:var(--muted);border-radius:12px;cursor:pointer;transition:color .2s}
#nxf .seg button[aria-pressed="true"]{color:var(--accent-ink)}
#nxf .seg button small{display:none}

/* choice: tiles */
#nxf .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
#nxf .tiles .slider{display:none}
#nxf .tiles button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:16px;min-height:118px;
  border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font:inherit;color:var(--ink);cursor:pointer;
  transition:border-color .2s,background .2s,transform .1s}
#nxf .tiles button span.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--field);color:var(--muted)}
#nxf .tiles button b{font-size:16px;font-weight:700}
#nxf .tiles button small{font-size:13px;color:var(--muted);line-height:1.35;margin-top:-6px}
#nxf .tiles button[aria-pressed="true"]{border-color:var(--sel,var(--accent));background:var(--sel-soft,var(--accent-soft))}
#nxf .tiles button[aria-pressed="true"] span.ic{background:var(--sel,var(--accent));color:var(--accent-ink)}
#nxf .seg span.ic{display:flex}

/* fields */
#nxf .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
#nxf .f{margin-bottom:20px}
#nxf .f:last-child{margin-bottom:0}
#nxf label{display:block;font-size:15px;font-weight:700;margin:0 0 8px}
#nxf .inp{position:relative}
#nxf .inp svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
#nxf input,#nxf textarea{width:100%;font:inherit;font-size:17px;font-weight:500;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:var(--r);outline:none;transition:border-color .15s,box-shadow .15s}
#nxf input{height:54px;padding:0 14px 0 44px}
#nxf textarea{min-height:150px;padding:14px;line-height:1.45;resize:vertical}
#nxf input::placeholder,#nxf textarea::placeholder{color:var(--muted);opacity:.75}
#nxf input:focus,#nxf textarea:focus{border-color:var(--sel,var(--accent));box-shadow:0 0 0 3px var(--sel-soft,var(--accent-soft))}
#nxf .hint{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px;line-height:1.4;color:var(--muted)}
#nxf .hint svg{width:18px;height:18px;margin-top:1px;color:var(--sel,var(--accent))}
#nxf .err{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:#FDECEA;color:#8A1C12;font-size:15px;font-weight:600}
#nxf .err.on{display:block}

/* send bar */
#nxf .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
#nxf .bar .wrap{display:block}
#nxf .send{width:100%;height:58px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:inherit;
  font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .1s,filter .15s}
#nxf .send:active{transform:scale(.98)}
#nxf .send:disabled{filter:saturate(.6) opacity(.8)}
#nxf .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:nxspin .7s linear infinite;display:none}
#nxf .send.busy .spin{display:block}
@keyframes nxspin{to{transform:rotate(360deg)}}

/* success */
#nxf .done{display:none;text-align:center;padding:36px 22px 26px}
#nxf.sent .form,#nxf.sent .bar{display:none}
#nxf.sent .done{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 60px)}
#nxf .check{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--sel-soft,var(--accent-soft));display:grid;place-items:center}
#nxf .check svg{width:44px;height:44px;stroke:var(--ok);stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;animation:nxdraw .5s .15s ease-out forwards}
@keyframes nxdraw{to{stroke-dashoffset:0}}
#nxf .done h2{font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.3px}
#nxf .done p{margin:0 auto 22px;max-width:300px;color:var(--muted);font-size:16px;line-height:1.45}
#nxf .sum{text-align:left;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:22px;font-size:15px}
#nxf .sum div{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
#nxf .sum span{color:var(--muted)}
#nxf .sum b{font-weight:700;text-align:right}
#nxf .again{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#nxf button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#nxf *{animation:none!important;transition:none!important}#nxf .check svg{stroke-dashoffset:0}}
</style>
<div class="wrap">
  <div class="form">
    <div class="head">
      <div class="badge" id="nxf-badge">AE</div>
      <div><h1 id="nxf-client">ABC Electric</h1><p>Field report</p></div>
    </div>

    <div class="tiles" id="nxf-choice" data-t="co" role="group" aria-label="Report type">
      <div class="slider"></div>
      <button type="button" data-t="co" aria-pressed="true"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span><b>Extra work</b><small>GC asked for something not in scope</small></button>
      <button type="button" data-t="dr" aria-pressed="false"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><b>End of day</b><small>Who worked, hours, what got done</small></button>
    </div>

    <div class="card">
      <div class="f"><label for="nxf-job">Job</label>
        <div class="inp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><input id="nxf-job" autocomplete="off" placeholder="Riverside Clinic"></div></div>
      <div class="f"><label for="nxf-name">Your name</label>
        <div class="inp"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><input id="nxf-name" autocomplete="name" placeholder="Mike"></div></div>
      <div class="f"><label for="nxf-note" id="nxf-note-label">What extra work did you do?</label>
        <textarea id="nxf-note" placeholder="Dave asked us to move 6 boxes in room 204. 2 guys, 2.5 hours, 40 ft of 12/2."></textarea>
        <div class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="nxf-hint">Tap the microphone on your keyboard to talk instead of type.</span></div></div>
    </div>
    <div class="err" id="nxf-err" role="alert"></div>
  </div>

  <div class="done" aria-live="polite">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="nxf-done-title">Sent to your PM</h2>
    <p id="nxf-done-text">Your extra work is logged. The PM gets it in under a minute to approve.</p>
    <div class="sum"><div><span>Job</span><b id="nxf-s-job">Riverside Clinic</b></div><div><span>Sent by</span><b id="nxf-s-name">Mike</b></div><div><span>Time</span><b id="nxf-s-time">2:14 pm</b></div></div>
    <button type="button" class="again" id="nxf-again">Send another</button>
  </div>
</div>
<div class="bar"><div class="wrap"><button type="button" class="send" id="nxf-send"><span class="spin"></span><span id="nxf-send-label">Send</span></button></div></div>

<script>
(function(){
  /* ===== EDIT PER CLIENT ===== */
  var CLIENT_NAME = "ABC Electric";
  var CO_HOOK = "https://hook.us2.make.com/u3n61fwxj6r098lhob8j7kjf4c5k81ub";
  var DAILY_HOOK = "https://hook.us2.make.com/zkjuttpthgecc5ubu9wth9v9z90tkeap";
  /* =========================== */
  var root = document.getElementById("nxf"), $ = function(i){return document.getElementById(i);};
  var type = "co";
  $("nxf-client").textContent = CLIENT_NAME;
  $("nxf-badge").textContent = CLIENT_NAME.split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();
  try{ $("nxf-name").value = localStorage.getItem("nxf_name")||""; $("nxf-job").value = localStorage.getItem("nxf_job")||""; }catch(e){}

  var copy = {
    co:{label:"What extra work did you do?", ph:"Dave asked us to move 6 boxes in room 204. 2 guys, 2.5 hours, 40 ft of 12/2.",
        title:"Sent to your PM", text:"Your extra work is logged. The PM gets it in under a minute to approve."},
    dr:{label:"Who worked today, and what got done?", ph:"Me and Jordan 7 to 5:30 pulling home runs on level 2. Kyle 7 to 3:30 bending EMT.",
        title:"Hours sent", text:"Your crew's hours are in the timesheet. Nothing else to do today."}
  };
  var choice = $("nxf-choice");
  function setType(t){
    type = t; choice.setAttribute("data-t", t);
    Array.prototype.forEach.call(choice.querySelectorAll("button"), function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-t")===t ? "true":"false"); });
    $("nxf-note-label").textContent = copy[t].label; $("nxf-note").placeholder = copy[t].ph;
  }
  Array.prototype.forEach.call(choice.querySelectorAll("button"), function(b){ b.onclick = function(){ setType(b.getAttribute("data-t")); }; });

  function err(m){ var e=$("nxf-err"); e.textContent=m; e.className = m ? "err on" : "err"; }
  function fmtTime(){ var d=new Date(), h=d.getHours(), m=("0"+d.getMinutes()).slice(-2); return ((h%12)||12)+":"+m+(h<12?" am":" pm"); }

  function showDone(job, name){
    $("nxf-done-title").textContent = copy[type].title; $("nxf-done-text").textContent = copy[type].text;
    $("nxf-s-job").textContent = job; $("nxf-s-name").textContent = name; $("nxf-s-time").textContent = fmtTime();
    root.className = "sent"; window.scrollTo(0,0);
  }
  window.nxfPreviewDone = function(){ showDone("Riverside Clinic","Mike"); };

  $("nxf-send").onclick = function(){
    var job=$("nxf-job").value.trim(), name=$("nxf-name").value.trim(), note=$("nxf-note").value.trim();
    if(!job||!name||!note){ err(!note ? "Add a few words about the work, then tap Send." : "Fill in the job and your name, then tap Send."); return; }
    err("");
    try{ localStorage.setItem("nxf_name",name); localStorage.setItem("nxf_job",job); }catch(e){}
    var d = new URLSearchParams(); d.append("job",job); d.append("foreman",name);
    if(type==="co"){ d.append("note",note); d.append("photo_url",""); } else { d.append("report",note); d.append("date",""); }
    var btn=$("nxf-send"); btn.disabled=true; btn.className="send busy"; $("nxf-send-label").textContent="Sending";
    fetch(type==="co"?CO_HOOK:DAILY_HOOK,{method:"POST",body:d})
      .then(function(r){ if(!r.ok) throw 0; $("nxf-note").value=""; showDone(job,name); })
      .catch(function(){ err("Didn't send. Check your signal and tap Send again. Your note is still here."); })
      .then(function(){ btn.disabled=false; btn.className="send"; $("nxf-send-label").textContent="Send"; });
  };
  $("nxf-again").onclick = function(){ root.className=""; };
})();
</script>
</div>

</body></html>
